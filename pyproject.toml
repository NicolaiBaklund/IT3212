[project]
name = "my-ml-project"
version = "0.1.0"
description = "A machine learning project with data processing, visualization, and deep learning libraries."
authors = [{ name = "Your Name", email = "you@example.com" }]
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
  "numpy",
  "pandas",
  "scikit-learn",
  "matplotlib",
  "opencv-python",
  "tensorflow",
  "torch",
  "geopy",
  "plotly",
  "ipykernel"
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["image_processing*", "Preprocessing*"]
